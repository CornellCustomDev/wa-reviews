name: wa-reviews
recipe: laravel
config:
  webroot: ./public
  php: 8.3
  composer_version: 2-latest

services:
  appserver:
    overrides:
      environment:
        # Boost's MCP server runs inside this container, where `lando` doesn't exist.
        # Host-side `boost:install` still reads the `lando php` default from config/boost.php.
        BOOST_PHP_EXECUTABLE_PATH: php


tooling:
  phpunit:
    service: appserver
    description: "Run PHP Unit tests: lando phpunit"

  ## Xdebug apache toggling
  xdebug-on:
    service: appserver
    description: Enable xdebug for apache
    cmd:
      - /bin/bash -c '
        [[ $(php -i | grep xdebug | grep "xdebug.mode") ]]
        || (echo "Lando was not built with xdebug. Add config.xdebug=true to your .lando.local.yml?" && exit 1)'
      - echo "[INFO] Enabling xdebug ..."
      - echo xdebug.mode = "debug,develop" > /usr/local/etc/php/conf.d/zzz-lando-xdebug.ini
      - /etc/init.d/apache2 reload
    user: root
  xdebug-off:
    service: appserver
    description: Disable xdebug for apache
    cmd:
      - echo "[INFO] Disabling xdebug ..."
      - echo xdebug.mode = "off" > /usr/local/etc/php/conf.d/zzz-lando-xdebug.ini
      - /etc/init.d/apache2 reload
    user: root
